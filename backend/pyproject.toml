[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Query() as argument defaults is the idiomatic pattern
# the framework is built around, not the mutable-default footgun B008 flags.
"app/api/**/*.py" = ["B008"]
"app/core/security.py" = ["B008"]
